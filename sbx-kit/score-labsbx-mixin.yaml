# syntax=docker/sandbox-kit:3
#
# The Score Labspace as a content kit for Docker Sandboxes. It carries the
# lab's instructions (labspace/), the sample app the learner works on, and the
# tools the lab uses (score-compose, score-k8s, kind, kubectl, helm);
# everything that runs them comes from the Labspace kit published by
# https://github.com/mathieu-benoit/labsbxes.
#
#   sbx run shell \
#     --kit ghcr.io/mathieu-benoit/labsbxes/labspace:latest \
#     --kit docker.io/scorespec/score-labsbx-mixin:latest \
#     -p 3030:3030 -p 8085:8085 -p 8080:8080 --name score-lab
#
# See docs/sbx.md, and score-labsbx.yaml for the same thing as one reference.
schemaVersion: "3"
kind: mixin

displayName: Score Labspace (content)
description: >-
  The Score Labspace: deploy the same score.yaml file to Docker Compose and to
  Kubernetes with score-compose and score-k8s, to be run by the Labspace kit.

version: "0.1.0"

# Becomes the org.opencontainers.image.source annotation, which is what links
# the published kit to this repository.
sourceUrl: https://github.com/score-spec/score-labspace

# The Labspace kit provides `labspace`. Composing this kit without it fails at
# resolution instead of producing a sandbox with files and nothing to show them.
requires: ["labspace >= 0.1.0"]

# One lab per sandbox: a second content kit provides the same name, and the
# runtime refuses the composition.
provides: ["labspace-content@0.1.0"]

capabilities:
  # The workload deployed with score-compose listens on port 8080
  # (http://<dns>.localhost:8080). sbx picks the host port (sbx port ls <name>),
  # -p 8080:8080 pins it to open the same URL from your own web browser.
  - type: com.docker.sandbox/port@1
    config:
      name: score-compose-app
      container: 8080
      transport: tcp

  # The Labspace kit only allows Docker Hub pulls and Open VSX.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # The images used by the default score-compose and score-k8s
          # provisioners (postgres, nginx, ...).
          - mirror.gcr.io
          # Releases and raw files: the Gateway API CRDs, the community patch
          # templates of the lab.
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          # The NGINX Gateway Fabric Helm chart and images.
          - ghcr.io
          - pkg-containers.githubusercontent.com
          # Docker Hardened Images, used by the sample app's Dockerfile.
          - dhi.io

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Score files validation and autocompletion in VS Code, based on the
        # Score JSON schema (the settings are in the project's .vscode/settings.json):
        # https://docs.score.dev/docs/score-specification/ide-linter-autocomplete/
        - command: code-server --install-extension redhat.vscode-yaml@2.0.0
          user: "1000"
          description: Install the VS Code YAML extension

      startup:
        # The sandbox VM has no /dev/kmsg, and the kubelet of the Kind node
        # fails to start without it. Docker passes it through to the
        # privileged Kind node container once it exists. /dev is reset at
        # every boot, hence a startup hook.
        - command: sh -c '[ -e /dev/kmsg ] || mknod /dev/kmsg c 1 11'
          user: "0"
          description: Create /dev/kmsg for the Kind cluster

        # Run from a clone (--kit ./sbx-kit), the IDE opens the clone's
        # project/ folder, which has no sample app: copy it there once.
        - command: /opt/score-labspace/seed-project.sh
          user: "1000"
          description: Copy the sample app into the project folder when it has none
