services:
  configurator:
    environment:
      PROJECT_CLONE_URL: https://github.com/score-spec/score-labspace

  interface:
    configs:
      - source: score-favicon
        target: /usr/local/app/public/docker.svg

  workspace:
    configs:
      - source: workspace-setup-script
        target: /entrypoint.d/10-setup-script.sh
        mode: 0755

configs:
  # Override the default allow list to add BuildKit builders and kind-specific mount points
  docker-proxy-mount-allowlist:
    content: |
      gates:
        - type: mountSource
          allowedSources:
            - labspace-content
            - labspace-socket-proxy
            - buildx_buildkit_default_state
            - buildx_buildkit_builder-*
            - label:labspace-resource=true
            - /lib/modules

  score-favicon:
    content: |
      <svg width="539" height="426" viewBox="0 0 539 426" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M392.121 120.531L409.751 68.3027C410.887 64.046 408.355 60.6105 404.048 60.6199L295.102 60.8156C290.796 60.8251 286.396 64.2867 285.26 68.5434L274.701 108.125L274.572 108.091L230.86 271.53C220.687 267.262 208.212 264.795 194.187 264.832C151.654 264.902 111.108 287.512 103.685 315.336C96.2622 343.16 124.703 365.614 167.262 365.551C208.47 365.485 247.66 344.235 256.878 317.645L257.39 316.142L309.679 120.655L349.678 120.57L392.121 120.531Z" fill="url(#paint0_linear_1826_24)"/>
      <path d="M193.932 239.359L204.078 202.672L124.937 159.87L226.4 106.878L238.575 60L60 155.033V164.708L193.932 239.359Z" fill="url(#paint1_linear_1826_24)"/>
      <path d="M344.097 157.832L333.951 194.519L413.092 237.32L311.629 290.313L299.453 337.19L478.029 242.158V232.483L344.097 157.832Z" fill="url(#paint2_linear_1826_24)"/>
      <defs>
      <linearGradient id="paint0_linear_1826_24" x1="98.5561" y1="341.887" x2="435.204" y2="63.2614" gradientUnits="userSpaceOnUse">
      <stop offset="0.520833" stop-color="#D9297D"/>
      <stop offset="1" stop-color="#F18520"/>
      </linearGradient>
      <linearGradient id="paint1_linear_1826_24" x1="98.5561" y1="341.887" x2="435.204" y2="63.2614" gradientUnits="userSpaceOnUse">
      <stop offset="0.520833" stop-color="#D9297D"/>
      <stop offset="1" stop-color="#F18520"/>
      </linearGradient>
      <linearGradient id="paint2_linear_1826_24" x1="98.5561" y1="341.887" x2="435.204" y2="63.2614" gradientUnits="userSpaceOnUse">
      <stop offset="0.520833" stop-color="#D9297D"/>
      <stop offset="1" stop-color="#F18520"/>
      </linearGradient>
      </defs>
      </svg>
  
  workspace-setup-script:
    content: |
      #!/bin/sh
      set -e

      cd project
      rm README.md
      git clone https://github.com/score-spec/sample-score-app .
      mkdir tmp
      cd tmp

      SCORE_COMPOSE_VERSION=$(curl -sL https://api.github.com/repos/score-spec/score-compose/releases/latest | jq -r .tag_name)
      wget https://github.com/score-spec/score-compose/releases/download/$${SCORE_COMPOSE_VERSION}/score-compose_$${SCORE_COMPOSE_VERSION}_linux_amd64.tar.gz
      tar -xvf score-compose_$${SCORE_COMPOSE_VERSION}_linux_amd64.tar.gz
      chmod +x score-compose
      sudo mv score-compose /usr/local/bin

      SCORE_K8S_VERSION=$(curl -sL https://api.github.com/repos/score-spec/score-k8s/releases/latest | jq -r .tag_name)
      wget https://github.com/score-spec/score-k8s/releases/download/$${SCORE_K8S_VERSION}/score-k8s_$${SCORE_K8S_VERSION}_linux_amd64.tar.gz
      tar -xvf score-k8s_$${SCORE_K8S_VERSION}_linux_amd64.tar.gz
      chmod +x score-k8s
      sudo mv score-k8s /usr/local/bin

      cd ..
      rm -rf tmp

      KIND_VERSION=$(curl -sL https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | jq -r .tag_name)
      curl -Lo ./kind https://kind.sigs.k8s.io/dl/$${KIND_VERSION}/kind-linux-amd64
      chmod +x ./kind
      sudo mv ./kind /usr/local/bin/kind
