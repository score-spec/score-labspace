name: Package and deploy Labspace

env:
  DOCKERHUB_REPO: scorespec/score-labspace

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the GitHub OIDC token
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKER_HUB_OIDC_CONNECTION_ID }}
        with:
          registry-auth: |
            - username: ${{ vars.DOCKER_HUB_ORG }}

      - name: Publish Labspace
        uses: dockersamples/publish-labspace-action@d8adcaea2f438ac2f770a88a4e7633555af9c580 # v2.0.0
        with:
          target_repo: ${{ env.DOCKERHUB_REPO }}
