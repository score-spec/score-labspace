  # ================================================================ score-k8s init

  # Two --patch-templates flags: the parser keeps the last one.
  - id: k-init-patch-community
    when:
      command: score-k8s init
      args:
        --patch-templates: "https://raw.githubusercontent.com/score-spec/community-patchers/refs/heads/main/score-k8s/service-account.tpl"
      state:
        k.init: true
    then:
      state:
        k.patched: "community"
      output:
        - "INFO: Fetching patch template from https://raw.githubusercontent.com/score-spec/community-patchers/refs/heads/main/score-k8s/unprivileged.tpl"
        - "INFO: Read 680 bytes from GET https://raw.githubusercontent.com/score-spec/community-patchers/refs/heads/main/score-k8s/unprivileged.tpl"
        - "INFO: Fetching patch template from https://raw.githubusercontent.com/score-spec/community-patchers/refs/heads/main/score-k8s/service-account.tpl"
        - "INFO: Read 419 bytes from GET https://raw.githubusercontent.com/score-spec/community-patchers/refs/heads/main/score-k8s/service-account.tpl"
        - "INFO: Found existing state directory"
        - "INFO: Updating patching templates.."
        - "INFO: Skipping creation of default provisioners file since it already exists"
        - "INFO: Skipping creation of initial Score file since it already exists"
        - "INFO: Read more about the Score specification at https://docs.score.dev/docs/"
  - id: k-init-patch
    when:
      command: score-k8s init
      args:
        --patch-templates: "k8s-unprivileged.tpl"
      state:
        k.init: true
    then:
      state:
        k.patched: "inline"
      output:
        - "INFO: Fetching patch template from k8s-unprivileged.tpl"
        - "INFO: Read 680 bytes from k8s-unprivileged.tpl"
        - "INFO: Found existing state directory"
        - "INFO: Updating patching templates.."
        - "INFO: Skipping creation of default provisioners file since it already exists"
        - "INFO: Skipping creation of initial Score file since it already exists"
        - "INFO: Read more about the Score specification at https://docs.score.dev/docs/"
  - id: k-init-nodefault-dns
    when:
      command: score-k8s init
      args:
        --no-default-provisioners: true
        --provisioners: "custom-dns.provisioners.yaml"
      state:
        k.init: true
    then:
      files:
        - create: ".score-k8s/ZxQVE3OACQc.9x1dV69QQebK5HBRc7DnYw.provisioners.yaml"
          content: |
            - uri: template://custom-dns
              type: dns
              description: Outputs a localhost domain as the hostname.
              outputs: |
                host: localhost
              expected_outputs:
                - host
      state:
        k.provs: "dns"
      output:
        - "INFO: Found existing state directory"
        - "INFO: Skipping creation of default provisioners file since it has been disabled"
        - "INFO: Skipping creation of initial Score file since it already exists"
        - "INFO: Read 164 bytes from custom-dns.provisioners.yaml"
        - "INFO: Wrote provisioner from 'custom-dns.provisioners.yaml' to .score-k8s/ZxQVE3OACQc.9x1dV69QQebK5HBRc7DnYw.provisioners.yaml"
        - "INFO: Read more about the Score specification at https://docs.score.dev/docs/"
  - id: k-init-dns
    when:
      command: score-k8s init
      args:
        --no-default-provisioners: false
        --provisioners: "custom-dns.provisioners.yaml"
      state:
        k.init: false
    then:
      files:
        - create: ".score-k8s/state.yaml"
          content: |
            # The local state of score-k8s (abridged in this simulation).
            workloads: {}
            resources: {}
        - create: ".score-k8s/zz-default.provisioners.yaml"
          content: |


            # Abridged in this simulation: the real file, written by score-k8s init, defines
            # 16 provisioners. Only the ones of the resource types this lab uses are kept.

            # The default dns provisioner just outputs a random localhost domain because we don't know whether external-dns is
            # available. You should replace this with your own dns name generation that matches your external-dns controller.
            - uri: template://default-provisioners/dns
              type: dns
              description: Outputs a *.localhost domain as the hostname.
              init: |
                randomHostname: dns{{ randAlphaNum 6 | lower }}.localhost
              state: |
                instanceHostname: {{ dig "instanceHostname" .Init.randomHostname .State | quote }}
              outputs: |
                host: {{ .State.instanceHostname }}
              expected_outputs:
                - host

            # Routes could be implemented as either traditional ingress resources or using the newer gateway API.
            # In this default provisioner we use the gateway API with some sensible defaults. But you may wish to replace this.
            - uri: template://default-provisioners/route
              type: route
              description: Provisions an HTTPRoute on a shared Nginx instance.
              init: |
                {{ if not (regexMatch "^/|(/([^/]+))+$" .Params.path) }}{{ fail "params.path start with a / but cannot end with /" }}{{ end }}
                {{ if not (regexMatch "^[a-z0-9_.-]{1,253}$" .Params.host) }}{{ fail (cat "params.host must be a valid hostname but was" .Params.host) }}{{ end }}
                {{ $ports := (index .WorkloadServices .SourceWorkload).Ports }}
                {{ if not $ports }}{{ fail "no service ports exist" }}{{ end }}
                {{ $port := index $ports (print .Params.port) }}
                {{ if not $port.TargetPort }}{{ fail "params.port is not a named service port" }}{{ end }}
              state: |
                routeName: route-{{ .SourceWorkload }}-{{ substr 0 8 .Guid | lower }}
              manifests: |
                - apiVersion: gateway.networking.k8s.io/v1
                  kind: HTTPRoute
                  metadata:
                    name: {{ .State.routeName }}
                    {{ if ne .Namespace "" }}
                    namespace: {{ .Namespace }}
                    {{ end }}
                    annotations:
                      k8s.score.dev/source-workload: {{ .SourceWorkload }}
                      k8s.score.dev/resource-uid: {{ .Uid }}
                      k8s.score.dev/resource-guid: {{ .Guid }}
                    labels:
                      app.kubernetes.io/managed-by: score-k8s
                      app.kubernetes.io/name: {{ .State.routeName }}
                      app.kubernetes.io/instance: {{ .State.routeName }}
                  spec:
                    parentRefs:
                    - name: default
                    hostnames:
                    - {{ .Params.host | quote }}
                    rules:
                    - matches:
                      - path:
                          type: PathPrefix
                          value: {{ .Params.path | quote }}
                      backendRefs:
                      - name: {{ (index .WorkloadServices .SourceWorkload).ServiceName }}
                        port: {{ .Params.port }}
              supported_params:
                - host
                - port
                - path

            - uri: template://default-provisioners/postgres
              type: postgres
              description: Provisions a dedicated database on a shared PostgreSQL instance.
              init: |
                randomDatabase: db-{{ randAlpha 8 }}
                randomUsername: user-{{ randAlpha 8 }}
                randomPassword: {{ randAlphaNum 16 | quote }}
              state: |
                service: pg-{{ .SourceWorkload }}-{{ substr 0 8 .Guid | lower }}
                database: {{ dig "database" .Init.randomDatabase .State | quote }}
                username: {{ dig "username" .Init.randomUsername .State | quote }}
                password: {{ dig "password" .Init.randomPassword .State | quote }}
              outputs: |
                host: {{ .State.service }}
                port: 5432
                name: {{ .State.database }}
                database: {{ .State.database }}
                username: {{ .State.username }}
                password: {{ encodeSecretRef .State.service "password" }}
              manifests: |
                - apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ .State.service }}
                    {{ if ne .Namespace "" }}
                    namespace: {{ .Namespace }}
                    {{ end }}
                    annotations:
                      k8s.score.dev/source-workload: {{ .SourceWorkload }}
                      k8s.score.dev/resource-uid: {{ .Uid }}
                      k8s.score.dev/resource-guid: {{ .Guid }}
                    labels:
                      app.kubernetes.io/managed-by: score-k8s
                      app.kubernetes.io/name: {{ .State.service }}
                      app.kubernetes.io/instance: {{ .State.service }}
                  data:
                    password: {{ .State.password | b64enc }}
                - apiVersion: apps/v1
                  kind: StatefulSet
                  metadata:
                    name: {{ .State.service }}
                    {{ if ne .Namespace "" }}
                    namespace: {{ .Namespace }}
                    {{ end }}
                    annotations:
                      k8s.score.dev/source-workload: {{ .SourceWorkload }}
                      k8s.score.dev/resource-uid: {{ .Uid }}
                      k8s.score.dev/resource-guid: {{ .Guid }}
                    labels:
                      app.kubernetes.io/managed-by: score-k8s
                      app.kubernetes.io/name: {{ .State.service }}
                      app.kubernetes.io/instance: {{ .State.service }}
                  spec:
                    replicas: 1
                    serviceName: {{ .State.service }}
                    selector:
                      matchLabels:
                        app.kubernetes.io/instance: {{ .State.service }}
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/managed-by: score-k8s
                          app.kubernetes.io/name: {{ .State.service }}
                          app.kubernetes.io/instance: {{ .State.service }}
                        annotations:
                          k8s.score.dev/source-workload: {{ .SourceWorkload }}
                          k8s.score.dev/resource-uid: {{ .Uid }}
