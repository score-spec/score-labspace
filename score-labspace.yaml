# syntax=docker/sandbox-kit:3
#
# The Score Labspace as a content kit for Docker Sandboxes, run by the Labspace
# kit from https://github.com/mathieu-benoit/labsbxes:
#
#   sbx run shell --kit ghcr.io/mathieu-benoit/labsbxes/labspace:0.1.3 --kit <this folder>
#
# It carries the lab's instructions (labspace/), the sample app the learner
# works on (project/), and the tools the lab uses (score-compose, score-k8s,
# kind, kubectl, helm). See score-labspace.dockerfile.
schemaVersion: "3"
kind: mixin

displayName: Score Labspace (content)
description: >-
  The Score Labspace: deploy the same score.yaml file to Docker Compose and to
  Kubernetes with score-compose and score-k8s. To be run by the Labspace kit.

version: "0.1.0"

sourceUrl: https://github.com/score-spec/score-labspace

# The Labspace kit provides `labspace`: without it, this kit fails at
# resolution instead of producing a sandbox with files and nothing to show them.
requires: ["labspace >= 0.1.0"]

# One lab per sandbox.
provides: ["labspace-content@0.1.0"]

capabilities:
  # The workload deployed with score-compose listens on port 8080
  # (http://<dns>.localhost:8080). sbx picks the host port (sbx ports <name>),
  # -p 8080:8080 pins it to open the same URL from your own web browser.
  - type: com.docker.sandbox/port@1
    config:
      name: score-compose-app
      container: 8080
      transport: tcp

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # The images used by the default score-compose and score-k8s
          # provisioners (postgres, nginx, ...).
          - mirror.gcr.io
          # Releases and raw files: the Gateway API CRDs, the community patch
          # templates of the lab.
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          # The NGINX Gateway Fabric Helm chart and images.
          - ghcr.io
          - pkg-containers.githubusercontent.com
          # Docker Hardened Images, used by the sample app's Dockerfile.
          - dhi.io
          # The VS Code YAML extension, installed at create.
          - open-vsx.org
          - openvsx.eclipsecontent.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Score files validation and autocompletion in VS Code, based on the
        # Score JSON schema (the settings are in project/.vscode/settings.json):
        # https://docs.score.dev/docs/score-specification/ide-linter-autocomplete/
        - command: code-server --install-extension redhat.vscode-yaml@2.0.0
          user: "1000"
          description: Install the VS Code YAML extension

      startup:
        # The sandbox VM has no /dev/kmsg, and the kubelet of the Kind node
        # fails to start without it. Docker passes it through to the
        # privileged Kind node container once it exists. /dev is reset at
        # every boot, hence a startup hook.
        - command: sh -c '[ -e /dev/kmsg ] || mknod /dev/kmsg c 1 11'
          user: "0"
          description: Create /dev/kmsg for the Kind cluster
