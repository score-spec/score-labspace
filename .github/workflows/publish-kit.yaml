name: publish-kit

# Builds and publishes this lab's Docker Sandboxes kits (see docs/sbx.md):
#
#   mixin   sbx-kit/score-labsbx-mixin.yaml   the lab's content kit
#                                             -> ghcr.io/<owner>/score-labsbx-mixin
#   set     score-labsbx.yaml                 a kit set merging the shell sandbox, the Labspace
#                                             kit and the content kit into one reference
#                                             -> ghcr.io/<owner>/score-labsbx
#
# The set runs after the mixin: its members are registry references, pinned by
# digest at build, so building it right after the mixin is published is what
# puts the new content in the set.
#
# Each kit is built by build-kit.yaml: on pull requests nothing is pushed (the
# kit is built to a local OCI layout and checked with kit-tck); on main it is
# published as :latest, :sha-<short> and, the first time, :<version>.
#
# Pull requests only build the mixin: the set would be built from the
# published :latest mixin, not the one the pull request changes.

on:
  pull_request:
    paths:
      - "labspace/**"
      - "sbx-kit/**"
      - "score-labsbx.yaml"
      - ".github/workflows/publish-kit.yaml"
      - ".github/workflows/build-kit.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-kit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mixin:
    uses: ./.github/workflows/build-kit.yaml
    permissions:
      contents: read
      packages: write
    with:
      name: score-labsbx-mixin
      descriptor: sbx-kit/score-labsbx-mixin.yaml
      # The repository root, so the kit carries labspace/.
      context: .

  set:
    needs: mixin
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-kit.yaml
    permissions:
      contents: read
      packages: write
    with:
      name: score-labsbx
      descriptor: score-labsbx.yaml
