      command: kind delete cluster
    then:
      output:
        - "Deleting cluster \"kind\" ..."

  # No cluster yet: every kubectl command fails.
  - id: kubectl-nocluster-error
    when:
      command: kubectl
      state:
        kind: false
    then:
      stderr:
        - "The connection to the server localhost:8080 was refused - did you specify the right host or port?"
      exit: 1
  - id: kubectl-apply-base
    completes: k-apply
    when:
      command: kubectl apply
      args:
        -f: "manifests.yaml"
      state:
        k.generated: "base"
        kube.deployed: "none"
    then:
      state:
        kube.deployed: "base"
      output:
        - "secret/pg-hello-world-80789b0d created"
        - "statefulset.apps/pg-hello-world-80789b0d created"
        - "service/pg-hello-world-80789b0d created"
        - "httproute.gateway.networking.k8s.io/route-hello-world-68d79d7c created"
        - "service/hello-world created"
        - "deployment.apps/hello-world created"
  - id: kubectl-apply-message
    when:
      command: kubectl apply
      args:
        -f: "manifests.yaml"
      state:
        k.generated: "message"
    then:
      state:
        kube.deployed: "message"
      output:
        - "secret/pg-hello-world-80789b0d unchanged"
        - "statefulset.apps/pg-hello-world-80789b0d unchanged"
        - "service/pg-hello-world-80789b0d unchanged"
        - "httproute.gateway.networking.k8s.io/route-hello-world-68d79d7c unchanged"
        - "service/hello-world unchanged"
        - "deployment.apps/hello-world configured"
  - id: kubectl-apply-patched
    when:
      command: kubectl apply
      args:
        -f: "manifests.yaml"
      state:
        k.generated: "patched"
    then:
      state:
        kube.deployed: "patched"
      output:
        - "secret/pg-hello-world-80789b0d unchanged"
        - "statefulset.apps/pg-hello-world-80789b0d unchanged"
        - "service/pg-hello-world-80789b0d unchanged"
        - "httproute.gateway.networking.k8s.io/route-hello-world-68d79d7c unchanged"
        - "service/hello-world unchanged"
        - "deployment.apps/hello-world configured"
  - id: kubectl-apply-custom
    when:
      command: kubectl apply
      args:
        -f: "manifests.yaml"
      state:
        k.generated: "custom"
        kube.deployed: "none"
    then:
      state:
        kube.deployed: "custom"
      output:
        - "secret/pg-hello-world-70a3dfc2 created"
        - "statefulset.apps/pg-hello-world-70a3dfc2 created"
        - "service/pg-hello-world-70a3dfc2 created"
        - "httproute.gateway.networking.k8s.io/route-hello-world-be2eb9a8 created"
        - "service/hello-world created"
        - "deployment.apps/hello-world created"
  - id: kubectl-apply-other
    when:
      command: kubectl apply
      args:
        -f: "manifests.yaml"
    then:
      output:
        - "secret/pg-hello-world-80789b0d unchanged"
        - "statefulset.apps/pg-hello-world-80789b0d unchanged"
        - "service/pg-hello-world-80789b0d unchanged"
        - "httproute.gateway.networking.k8s.io/route-hello-world-68d79d7c unchanged"
        - "service/hello-world unchanged"
        - "deployment.apps/hello-world unchanged"
  - id: kubectl-wait-custom
    when:
      command: kubectl wait
      state:
        kube.deployed: "custom"
    then:
      output:
        - { text: "pod/hello-world-7b4c9d6f8f-q2m8n condition met", delay: rollout }
        - "pod/pg-hello-world-70a3dfc2-0 condition met"
  - id: kubectl-wait-none-error
    when:
      command: kubectl wait
      state:
        kube.deployed: "none"
    then:
      stderr:
        - "error: no matching resources found"
      exit: 1
  - id: kubectl-wait
    completes: k-wait
    when:
      command: kubectl wait
    then:
      output:
        - { text: "pod/hello-world-6d9f7c8b5d-x7k2p condition met", delay: rollout }
        - "pod/pg-hello-world-80789b0d-0 condition met"
  - id: kubectl-rollout
    when:
      command: kubectl rollout status
      args:
        0: "deployment/hello-world"
    then:
      output:
        - "Waiting for deployment \"hello-world\" rollout to finish: 1 old replicas are pending termination..."
        - { text: "deployment \"hello-world\" successfully rolled out", delay: rollout }
  - id: kubectl-get-all
    when:
      command: kubectl get
      args:
        0: "all,statefulset,secret,httproute"
      state:
        kube.deployed: "base"
    then:
      output:
        - "NAME                                          READY   STATUS    RESTARTS      AGE"
        - "pod/hello-world-6d9f7c8b5d-x7k2p              1/1     Running   1 (40s ago)   52s"
        - "pod/pg-hello-world-80789b0d-0                 1/1     Running   0             52s"
        - ""
        - "NAME                              TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)    AGE"
        - "service/hello-world               ClusterIP   10.96.142.87    <none>        8080/TCP   52s"
        - "service/kubernetes                ClusterIP   10.96.0.1       <none>        443/TCP    3m"
        - "service/pg-hello-world-80789b0d   ClusterIP   10.96.211.34    <none>        5432/TCP   52s"
        - ""
        - "NAME                          READY   UP-TO-DATE   AVAILABLE   AGE"
        - "deployment.apps/hello-world   1/1     1            1           52s"
        - ""
        - "NAME                                     DESIRED   CURRENT   READY   AGE"
        - "replicaset.apps/hello-world-6d9f7c8b5d   1         1         1       52s"
        - ""
        - "NAME                                       READY   AGE"
        - "statefulset.apps/pg-hello-world-80789b0d   1/1     52s"
        - ""
        - "NAME                             TYPE     DATA   AGE"
        - "secret/pg-hello-world-80789b0d   Opaque   1      52s"
        - ""
        - "NAME                                                         HOSTNAMES                 AGE"
        - "httproute.gateway.networking.k8s.io/route-hello-world-68d79d7c   [\"dnsoibbep.localhost\"]   52s"
  - id: kubectl-get-httproute-custom
    when:
      command: kubectl get
      args:
        0: "httproute"
      state:
        kube.deployed: "custom"
    then:
      output:
        - "NAME                         HOSTNAMES       AGE"
        - "route-hello-world-be2eb9a8   [\"localhost\"]   15s"
  - id: kubectl-get-pods-patched
    completes: k-patch
    when:
      command: kubectl get pods
      args:
        -l: "app.kubernetes.io/name=hello-world"
      state:
        kube.deployed: "patched"
    then:
      output:
        - "{"
        - "  \"allowPrivilegeEscalation\": false,"
        - "  \"capabilities\": {"
        - "    \"drop\": ["
        - "      \"ALL\""
        - "    ]"
        - "  },"
        - "  \"privileged\": false,"
        - "  \"readOnlyRootFilesystem\": true"
        - "}"
  - id: kubectl-get-other
    when:
      command: kubectl get
    then:
      output:
        - "No resources found in default namespace."
  - id: kubectl-delete
    when:
      command: kubectl delete
      args:
        -f: "manifests.yaml"
      state:
        kube.deployed: "patched"
    then:
      state:
        kube.deployed: "none"
      output:
        - "secret \"pg-hello-world-80789b0d\" deleted"
        - "statefulset.apps \"pg-hello-world-80789b0d\" deleted"
        - "service \"pg-hello-world-80789b0d\" deleted"
        - "httproute.gateway.networking.k8s.io \"route-hello-world-68d79d7c\" deleted"
        - "service \"hello-world\" deleted"
        - { text: "deployment.apps \"hello-world\" deleted", delay: rollout }
  - id: kubectl-delete-other
    when:
      command: kubectl delete
    then:
      state:
        kube.deployed: "none"
      output:
        - "deployment.apps \"hello-world\" deleted"
