services:
  configurator:
    environment:
      PROJECT_CLONE_URL: https://github.com/score-spec/score-labspace

  interface:
    configs:
      - source: score-favicon
        target: /usr/local/app/public/docker.svg

  workspace:
    configs:
      - source: workspace-setup-script
        target: /entrypoint.d/10-setup-script.sh
        mode: 0755

configs:
  # Override the default allow list to add BuildKit builders and kind-specific mount points
  docker-proxy-mount-allowlist:
    content: |
      gates:
        - type: mountSource
          allowedSources:
            - labspace-content
            - labspace-socket-proxy
            - buildx_buildkit_default_state
            - buildx_buildkit_builder-*
            - label:labspace-resource=true
            - /lib/modules

  score-favicon:
    file: ./score-icon-color.svg
  
  workspace-setup-script:
    content: |
      #!/bin/sh
      set -e

      cd project
      rm README.md
      git clone https://github.com/score-spec/sample-score-app .

      # Score files validation and autocompletion in VS Code, based on the Score JSON schema:
      # https://docs.score.dev/docs/score-specification/ide-linter-autocomplete/
      code-server --install-extension redhat.vscode-yaml@2.0.0
      mkdir -p .vscode
      cat > .vscode/settings.json <<EOF
      {
        "yaml.schemas": {
          "https://raw.githubusercontent.com/score-spec/spec/main/score-v1b1.json": ["score.yaml", "*.score.yaml"]
        },
        "redhat.telemetry.enabled": false
      }
      EOF
      echo ".vscode/" >> .git/info/exclude

      mkdir tmp
      cd tmp

      # Resolve the latest release tag from the GitHub redirect instead of the GitHub API,
      # to avoid hitting the unauthenticated API rate limit when many people run this lab from the same network.
      latest_tag() {
        basename "$(curl -sSLo /dev/null -w '%{url_effective}' https://github.com/$${1}/releases/latest)"
      }

      SCORE_COMPOSE_VERSION=$(latest_tag score-spec/score-compose)
      wget -q https://github.com/score-spec/score-compose/releases/download/$${SCORE_COMPOSE_VERSION}/score-compose_$${SCORE_COMPOSE_VERSION}_linux_amd64.tar.gz
      tar -xvf score-compose_$${SCORE_COMPOSE_VERSION}_linux_amd64.tar.gz
      chmod +x score-compose
      sudo mv score-compose /usr/local/bin

      SCORE_K8S_VERSION=$(latest_tag score-spec/score-k8s)
      wget -q https://github.com/score-spec/score-k8s/releases/download/$${SCORE_K8S_VERSION}/score-k8s_$${SCORE_K8S_VERSION}_linux_amd64.tar.gz
      tar -xvf score-k8s_$${SCORE_K8S_VERSION}_linux_amd64.tar.gz
      chmod +x score-k8s
      sudo mv score-k8s /usr/local/bin

      cd ..
      rm -rf tmp

      KIND_VERSION=$(latest_tag kubernetes-sigs/kind)
      curl -Lo ./kind https://kind.sigs.k8s.io/dl/$${KIND_VERSION}/kind-linux-amd64
      chmod +x ./kind
      sudo mv ./kind /usr/local/bin/kind
